# A genuinely crash-looping dummy workload for the agent to investigate.
# It's not a fixture string -- the container really starts, logs a DB
# timeout, and exits 1, so `kubectl logs` / `kubectl get pod` / a real
# `kubectl delete pod` (restart) all return real data.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-service
  namespace: ${STAGING_NS}
  labels:
    demo.io/managed-by: pod-investigator
    app: checkout-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-service
  template:
    metadata:
      labels:
        app: checkout-service
        demo.io/managed-by: pod-investigator
    spec:
      containers:
        - name: checkout-service
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "$(date -Iseconds) INFO  starting checkout-service"
              sleep 2
              echo "$(date -Iseconds) ERROR db connection failed: timeout connecting to postgres://prod-db.internal:5432/checkout_db: context deadline exceeded"
              echo "$(date -Iseconds) ERROR connection pool exhausted after 3 retries"
              sleep 1
              exit 1
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
