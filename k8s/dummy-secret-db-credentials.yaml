# Dummy, obviously-fake credential. Never legitimately read in the scripted
# demo -- the whole point is that the policy denies get_secret before this
# is ever fetched. Kept as a real Secret object so the denial is evaluated
# against a real (if synthetic) target, not a hardcoded string.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: ${PROD_NS}
  labels:
    demo.io/managed-by: pod-investigator
type: Opaque
stringData:
  DB_CONNECTION_STRING: "postgres://checkout_app:demo-value-not-real@prod-db.internal:5432/checkout_db"
