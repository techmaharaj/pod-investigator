# allInOne mode (the chart default) runs the image's legacy v1-compat
# entrypoint, driven by COLLECTOR_* env vars -- the top-level `config:`
# values key is a no-op there (it's only wired into the split
# collector/query deployment templates, which this chart doesn't use in
# allInOne mode). COLLECTOR_OTLP_*_HOST_PORT env vars don't rebind the
# OTLP receiver's host either (it's hardcoded to localhost:4317/4318 in
# the v1-compat translation layer, unreachable from the otel-collector
# pod). The only way to actually control the real v2 OTel-Collector config
# underneath is `userconfig`, a raw config file the chart mounts and passes
# via `--config` (see jaeger/templates/{user-config,allinone-deploy}.yaml
# in the chart) -- this replaces the v1-compat env-var translation
# entirely, so it has to be a complete pipeline, not just an override.
fullnameOverride: jaeger

provisionDataStore:
  cassandra: false
  elasticsearch: false

resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

userconfig: |
  service:
    extensions: [jaeger_storage, jaeger_query, healthcheckv2]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [jaeger_storage_exporter]

  extensions:
    healthcheckv2:
      use_v2: true
      http:
        endpoint: 0.0.0.0:13133
    jaeger_query:
      storage:
        traces: primary_store
    jaeger_storage:
      backends:
        primary_store:
          memory:
            max_traces: 20000

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch: {}

  exporters:
    jaeger_storage_exporter:
      trace_storage: primary_store
